<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TO DO LIST</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>

<body id="change">
    <header class="header">
        <h1>TO DO LIST</h1>
        <div class="mode">
            <button id="light">
            Dark Mode
            </button>
        </div>
        <hr>
    </header>
    <main class="container">
        <label for="task">Enter a task</label>
        <input type="text" id="task" placeholder="Enter a task">
        <p>
            Priority
            <select id="priority">
                <option>Low</option>
                <option>Medium</option>
                <option>High</option>
            </select>
        </p>
        <button id="add-btn">ADD Task</button>
        <p>
            Search:
            <input type="search" id="search" placeholder="Search tasks">
        </p>
        <button id="all">
            All
        </button>
        <button id="active">
            Active
        </button>
        <button id="completed">
            Completed
        </button>
        <p>
            Sort
            <select id="sort">
                <option>Newest First</option>
                <option>Oldest First</option>
                <option>A-Z</option>
                <option>Z-A</option>
            </select>
        </p>
        <div class="statistics">
            <p>
                Statistics

            </p>
        </div>
        <p>Total :
            <span id="total-count">0</span>
        </p>
        <p>
            Completed :
            <span id="completed-count">0</span>
        </p>
        <p>
            Pending :
            <span id="pending-count">0</span>
        </p>
        <p>
            Progress :
            <span id="progress-count">0</span>
        </p>
        <h2>Task List</h2>

        <ol id="task-list" class="task-list">

        </ol>



        <p id="no-task-message">
            No Tasks Found
        </p>
        <button id="clear-completed">
            Clear Completed
        </button>
        <button id="delete-all">
            Delete All
        </button>

    </main>
    <hr>
    <footer class="footer">
        <p>Todo App</p>
    </footer>
    <script src="js/app.js"></script>
</body>

</html>
